type OrganizationUser {
  organizationId: ID!
  userId: ID!
  user: User!
  createdAt: String!
  updatedAt: String!
}

type OrganizationUserEdge {
  cursor: String!
  node: OrganizationUser!
}

type OrganizationUserConnection {
  edges: [OrganizationUserEdge!]!
  pageInfo: PageInfo!
}

type Organization {
  id: ID!
  name: String!
  organizationUsers(first: Int = 20, after: String): OrganizationUserConnection!
  createdAt: String!
  posts(first: Int = 20, after: String): PostConnection!
  updatedAt: String!
}

type OrganizationEdge {
  cursor: String!
  node: Organization!
}

type OrganizationConnection {
  edges: [OrganizationEdge!]!
  pageInfo: PageInfo!
}

type Query {
  organizations(first: Int = 20, after: String): OrganizationConnection!
  organization(id: ID!): Organization
  organizationUsers(
    organizationId: ID!
    first: Int = 20
    after: String
  ): OrganizationUserConnection!
}

type Mutation {
  createOrganization(name: String!): APIResponse!
  updateOrganization(id: ID!, name: String!): APIResponse!
  deleteOrganization(id: ID!): APIResponse!
  addUserToOrganization(organizationId: ID!, userId: ID!): APIResponse!
  removeUserFromOrganization(organizationId: ID!, userId: ID!): APIResponse!
}
