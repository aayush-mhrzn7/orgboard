type OrganizationUser {
  organizationId: ID!
  userId: ID!
  user: User!
  createdAt: String!
  updatedAt: String!
}

type Organization {
  id: ID!
  name: String!
  organizationUsers: [OrganizationUser!]!
  createdAt: String!
  posts: [Post!]!
  updatedAt: String!
}

type Query {
  organizations: [Organization!]!
  organization(id: ID!): Organization
  organizationUsers(organizationId: ID!): [OrganizationUser!]!
}

type Mutation {
  createOrganization(name: String!): Organization!
  updateOrganization(id: ID!, name: String!): Organization!
  deleteOrganization(id: ID!): Organization!
  addUserToOrganization(organizationId: ID!, userId: ID!): Boolean!
  removeUserFromOrganization(organizationId: ID!, userId: ID!): Boolean!
}

