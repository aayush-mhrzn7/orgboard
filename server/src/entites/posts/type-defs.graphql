type Post {
  id: ID!
  title: String!
  content: String!
  authorId: ID
  author: User!
  organizationId: ID
  createdAt: String!
  updatedAt: String!
}

type PostEdge {
  cursor: String!
  node: Post!
}

type PostConnection {
  edges: [PostEdge!]!
  pageInfo: PageInfo!
}

type Query {
  posts(first: Int = 20, after: String): PostConnection!
  post(id: ID!): Post
}

type Mutation {
  createPost(title: String!, content: String!, organizationId: ID!): APIResponse!
  updatePost(id: ID!, title: String, content: String): APIResponse!
  deletePost(id: ID!): APIResponse!
}
