type Post {
  id: ID!
  title: String!
  content: String!
  authorId: ID
  author: User!
  organizationId: ID
  createdAt: String!
  updatedAt: String!
}

type Query {
  posts: [Post!]!
  post(id: ID!): Post
}

type Mutation {
  createPost(title: String!, content: String!, organizationId: ID!): APIResponse!
  updatePost(id: ID!, title: String, content: String): APIResponse!
  deletePost(id: ID!): APIResponse!
}
