type Tag {
  id: ID!
  name: String!
  createdAt: String!
  updatedAt: String!
}

type TagEdge {
  cursor: String!
  node: Tag!
}

type TagConnection {
  edges: [TagEdge!]!
  pageInfo: PageInfo!
}

type Query {
  tags(first: Int = 20, after: String): TagConnection!
  tag(id: ID!): Tag
}

type Mutation {
  createTag(name: String!): APIResponse!
  updateTag(id: ID!, name: String!): APIResponse!
  deleteTag(id: ID!): APIResponse!
}
