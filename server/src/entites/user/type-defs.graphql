type User {
  id: ID!
  name: String!
  email: String!
}

type UserEdge {
  cursor: String!
  node: User!
}

type UserConnection {
  edges: [UserEdge!]!
  pageInfo: PageInfo!
}

type Query {
  me: User
  users(first: Int = 20, after: String): UserConnection!
}

type Mutation {
  signup(name: String!, email: String!, password: String!): APIResponse!
  login(email: String!, password: String!): APIResponse!
  logout: APIResponse!
  refreshToken: APIResponse!
  updateUser(name: String, email: String, password: String): APIResponse!
}
