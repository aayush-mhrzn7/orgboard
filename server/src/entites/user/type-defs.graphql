type User {
  id: ID!
  name: String!
  email: String!
}

type Query {
  me: User
  users: [User!]!
}

type Mutation {
  signup(name: String!, email: String!, password: String!): APIResponse!
  login(email: String!, password: String!): APIResponse!
  logout: APIResponse!
  refreshToken: APIResponse!
  updateUser(name: String, email: String, password: String): APIResponse!
}
